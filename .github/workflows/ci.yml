name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change Classification
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app_validation: ${{ steps.classify.outputs.app_validation }}
      dependency_policy: ${{ steps.classify.outputs.dependency_policy }}
      workflow_files: ${{ steps.classify.outputs.workflow_files }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          workflow_files=false
          app_validation=false
          dependency_policy=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${BEFORE_SHA}"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "[INFO] Unable to resolve a diff base; running change-gated lanes conservatively."
            workflow_files=true
            app_validation=true
            dependency_policy=true
          else
            mapfile -t changed_files < <(git diff --name-only "$base_sha" "$GITHUB_SHA")

            for file in "${changed_files[@]}"; do
              case "$file" in
                .github/workflows/*|.github/actions/*)
                  workflow_files=true
                  ;;
              esac

              case "$file" in
                app/*|components/*|hooks/*|lib/*|public/*|tests/*|package.json|bun.lock|next.config.ts|playwright.config.ts|proxy.ts|eslint.config.mjs|postcss.config.mjs|tsconfig.json|bunfig.toml|next-env.d.ts)
                  app_validation=true
                  ;;
              esac

              case "$file" in
                dependency-license-policy.json|scripts/check-licenses.mjs|package.json|bun.lock|.github/workflows/check-updates.yml|.github/workflows/ci.yml|.github/workflows/dependency-review.yml|.github/workflows/security-audits.yml)
                  dependency_policy=true
                  ;;
              esac
            done

            printf '%s\n' "Compared $base_sha -> $GITHUB_SHA across ${#changed_files[@]} changed file(s)." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            printf '%s\n' "workflow_files=$workflow_files"
            printf '%s\n' "app_validation=$app_validation"
            printf '%s\n' "dependency_policy=$dependency_policy"
          } >> "$GITHUB_OUTPUT"

          {
            printf '%s\n' "## Change-gated lanes"
            printf '%s\n' ''
            printf '%s\n' "- Workflow lint: \`$workflow_files\`"
            printf '%s\n' "- App validation lanes (lint/typecheck/unused/build/tests): \`$app_validation\`"
            printf '%s\n' "- Dependency license policy lane: \`$dependency_policy\`"
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    name: Workflow Lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.workflow_files == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1

  dependency-policy:
    name: Dependency Policy
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.dependency_policy == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Enforce dependency license policy
        run: bun run check:licenses

      - name: Upload dependency license policy report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-license-policy-report
          path: .artifacts/licenses/license-policy-report.json
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.app_validation == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Run lint
        run: bun run lint:check

  typecheck:
    name: Type Check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.app_validation == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Run type check
        run: bun run typecheck

  unused:
    name: Unused Code Check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.app_validation == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Run unused code check
        run: bun run check:unused

  build:
    name: Build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.app_validation == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-cache-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', 'package.json', 'tsconfig.json', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-cache-${{ hashFiles('**/bun.lock') }}-

      - name: Validate production env contract and build project
        env:
          NEXT_PUBLIC_API_URL: https://api.anicards.alpha49.com
          NEXT_PUBLIC_APP_URL: https://anicards.alpha49.com
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder-upstash-token
          CRON_SECRET: ci-placeholder-cron-secret
          API_SECRET_TOKEN: ci-placeholder-request-proof-secret
        run: |
          bun run validate:production-env
          bun run build

      - name: Upload Next build
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 7

  unit-tests:
    name: Unit Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.app_validation == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Run unit tests with coverage
        run: bun run test:unit:coverage

      - name: Enforce unit test line coverage threshold
        env:
          COVERAGE_LINES_THRESHOLD: "73"
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const reportPath = ".artifacts/coverage/lcov.info";
          const threshold = Number(process.env.COVERAGE_LINES_THRESHOLD ?? "73");
          const normalizeCoveragePath = (filePath) => filePath.replace(/\\/g, "/");
          const shouldSkipCoverageRecord = (filePath) =>
            /\.(test|spec)\.[cm]?[jt]sx?$/i.test(normalizeCoveragePath(filePath));

          if (!Number.isFinite(threshold)) {
            console.error(`Invalid COVERAGE_LINES_THRESHOLD: ${process.env.COVERAGE_LINES_THRESHOLD ?? ""}`);
            process.exit(1);
          }

          if (!fs.existsSync(reportPath)) {
            console.error(`Coverage report not found at ${reportPath}`);
            process.exit(1);
          }

          let linesFound = 0;
          let linesHit = 0;
          let currentFile = null;

          for (const line of fs.readFileSync(reportPath, "utf8").split(/\r?\n/)) {
            if (line.startsWith("SF:")) {
              currentFile = line.slice(3);
            } else if (line.startsWith("LF:")) {
              if (currentFile && shouldSkipCoverageRecord(currentFile)) {
                continue;
              }
              linesFound += Number(line.slice(3));
            } else if (line.startsWith("LH:")) {
              if (currentFile && shouldSkipCoverageRecord(currentFile)) {
                continue;
              }
              linesHit += Number(line.slice(3));
            } else if (line === "end_of_record") {
              currentFile = null;
            }
          }

          if (linesFound === 0) {
            console.error("LCOV report did not include any executable lines.");
            process.exit(1);
          }

          const lineCoverage = (linesHit / linesFound) * 100;
          console.log(
            `Line coverage (excluding *.test/spec files): ${lineCoverage.toFixed(2)}% (${linesHit}/${linesFound}); threshold: ${threshold.toFixed(2)}%`
          );

          if (lineCoverage < threshold) {
            console.error(
              `Coverage threshold not met: ${lineCoverage.toFixed(2)}% < ${threshold.toFixed(2)}%`
            );
            process.exit(1);
          }
          NODE

      - name: Upload unit test coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: .artifacts/coverage
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  e2e-chromium:
    name: E2E Chromium
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: ${{ needs.changes.outputs.app_validation == 'true' }}
    permissions:
      actions: read
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://anicards.alpha49.com
      NEXT_PUBLIC_API_URL: https://api.anicards.alpha49.com
      NEXT_PUBLIC_APP_URL: https://anicards.alpha49.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "const version = require('./package.json').devDependencies['@playwright/test']; if (!version) throw new Error('Missing @playwright/test devDependency'); version.replace(/^[^0-9]*/, '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Download Next build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: Install Playwright browsers and system dependencies
        run: bunx playwright install --with-deps

      - name: Run Playwright E2E tests (Chromium)
        id: playwright_chromium
        run: bun run test:e2e -- --project=chromium

      - name: Upload Playwright artifacts (Chromium)
        if: ${{ always() && steps.playwright_chromium.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium
          path: |
            .artifacts/playwright-report
            .artifacts/playwright-test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  e2e-mobile:
    name: E2E Mobile Chrome
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: ${{ needs.changes.outputs.app_validation == 'true' }}
    permissions:
      actions: read
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://anicards.alpha49.com
      NEXT_PUBLIC_API_URL: https://api.anicards.alpha49.com
      NEXT_PUBLIC_APP_URL: https://anicards.alpha49.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "const version = require('./package.json').devDependencies['@playwright/test']; if (!version) throw new Error('Missing @playwright/test devDependency'); version.replace(/^[^0-9]*/, '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Download Next build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: Install Playwright browsers and system dependencies
        run: bunx playwright install --with-deps

      - name: Run Playwright E2E tests (Mobile Chrome)
        id: playwright_mobile
        run: bun run test:e2e -- --project=mobile-chrome

      - name: Upload Playwright artifacts (Mobile Chrome)
        if: ${{ always() && steps.playwright_mobile.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mobile-chrome
          path: |
            .artifacts/playwright-report
            .artifacts/playwright-test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  e2e-firefox:
    name: E2E Firefox Routes
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: ${{ needs.changes.outputs.app_validation == 'true' }}
    permissions:
      actions: read
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://anicards.alpha49.com
      NEXT_PUBLIC_API_URL: https://api.anicards.alpha49.com
      NEXT_PUBLIC_APP_URL: https://anicards.alpha49.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "const version = require('./package.json').devDependencies['@playwright/test']; if (!version) throw new Error('Missing @playwright/test devDependency'); version.replace(/^[^0-9]*/, '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Download Next build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: Install Playwright browsers and system dependencies
        run: bunx playwright install --with-deps

      - name: Run Playwright route suite (Firefox)
        id: playwright_firefox
        run: bun run test:e2e -- tests/e2e/search tests/e2e/user --project=firefox

      - name: Upload Playwright artifacts (Firefox)
        if: ${{ always() && steps.playwright_firefox.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-firefox
          path: |
            .artifacts/playwright-report
            .artifacts/playwright-test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  e2e-firefox-smoke:
    name: E2E Firefox Smoke
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: ${{ needs.changes.outputs.app_validation == 'true' }}
    permissions:
      actions: read
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://anicards.alpha49.com
      NEXT_PUBLIC_API_URL: https://api.anicards.alpha49.com
      NEXT_PUBLIC_APP_URL: https://anicards.alpha49.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "const version = require('./package.json').devDependencies['@playwright/test']; if (!version) throw new Error('Missing @playwright/test devDependency'); version.replace(/^[^0-9]*/, '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-

      - name: Setup Bun dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Download Next build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: Install Playwright browsers and system dependencies
        run: bunx playwright install --with-deps

      - name: Run Playwright local smoke tests (Firefox)
        id: playwright_firefox_smoke
        run: bun run test:e2e -- tests/e2e/smoke/unmocked-app-shell.spec.ts --project=firefox

      - name: Upload Playwright artifacts (Firefox Smoke)
        if: ${{ always() && steps.playwright_firefox_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-firefox-smoke
          path: |
            .artifacts/playwright-report
            .artifacts/playwright-test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
